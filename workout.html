<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burn-Ex — Live Workout</title>
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/workout.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="app-shell">
  <aside id="sidebarMount"></aside>
  <div class="main-area">
    <div id="topbarMount"></div>

    <div class="row g-3">
      <div class="col-lg-8">
        <div class="workout-stage">
          <div class="stage-toolbar">
            <div class="size-toggle">
              <button data-size="small" onclick="setStageSize('small', this)">Small</button>
              <button data-size="medium" onclick="setStageSize('medium', this)">Medium</button>
              <button data-size="large" onclick="setStageSize('large', this)">Large</button>
            </div>
            <button class="btn btn-sm btn-outline-teal" onclick="toggleFullscreen()">⛶ Fullscreen</button>
          </div>
          <div class="video-frame size-medium" id="videoFrame">
            <video id="inputVideo" playsinline autoplay muted></video>
            <canvas id="outputCanvas"></canvas>
            <div class="hud-center-msg" id="cameraPlaceholder">
              <div style="font-size:2.4rem;">🎥</div>
              <div>Choose an exercise and press <b>Start</b> to enable your camera.<br>MediaPipe Pose tracks your joints entirely on-device.</div>
            </div>
            <div class="hud-overlay d-none" id="hudOverlay">
              <div class="hud-chip text-teal">● TRACKING</div>
              <div class="hud-chip" id="hudTimer">00:00</div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card-b mb-3">
          <div class="section-title">Choose exercise</div>
          <div class="d-flex flex-column gap-2" id="exercisePicker"></div>
        </div>

        <div class="card-b mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <span class="text-dim" style="font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;">Reps</span>
            <span class="text-dim" style="font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;">Calories</span>
          </div>
          <div class="d-flex justify-content-between align-items-baseline">
            <div class="rep-counter-big" id="repCount">0</div>
            <div class="rep-counter-big text-teal" style="font-size:2.4rem;" id="calCount">0.0</div>
          </div>
          <div class="text-faint mt-1" style="font-size:.75rem;" id="intensityLabel">Intensity: —</div>
        </div>

        <div class="d-grid gap-2">
          <button class="btn btn-ember" id="startWorkoutBtn" onclick="startWorkout()" disabled>▶ Start session</button>
          <button class="btn btn-outline-teal d-none" id="stopWorkoutBtn" onclick="stopWorkout(true)">⏹ Stop &amp; save</button>
        </div>
        <div id="workoutMsg" class="text-faint text-center mt-2" style="font-size:.78rem;">Select an exercise to begin</div>
      </div>
    </div>
  </div>
</div>

<div class="toast-burnex" id="toastBox"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script src="js/mediapipe.js"></script>
<script src="js/tensorflow.js"></script>
<script src="js/calories.js"></script>
<script src="js/reps.js"></script>
<script src="js/workout.js"></script>
</body>
</html>
