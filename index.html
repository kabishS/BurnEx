<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burn-Ex — Log in</title>
<meta name="description" content="Burn-Ex — AI-based calorie estimation, tracked on-device.">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="auth-wrap">
  <div style="width:100%;max-width:440px;">
    <div class="text-center mb-4">
      <div class="brand-mark justify-content-center">
        <span class="flame">🔥</span> Burn-Ex
      </div>
      <div class="text-dim mt-1" style="font-size:.85rem;">AI-based calorie estimation, right in your browser</div>
    </div>

    <div class="auth-card">
      <div class="auth-tabs">
        <button id="tabLoginBtn" class="active" onclick="switchAuthTab('login')" type="button">Log in</button>
        <button id="tabRegisterBtn" onclick="switchAuthTab('register')" type="button">Create account</button>
      </div>

      <div id="authError" class="auth-error d-none"></div>

      <!-- LOGIN -->
      <form id="loginForm" onsubmit="return handleLogin(event)">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" id="loginUsername" required autocomplete="username">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="loginPassword" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-ember w-100 mt-2">Log in</button>
      </form>

      <!-- REGISTER -->
      <form id="registerForm" class="d-none" onsubmit="return handleRegister(event)">
        <div class="role-toggle">
          <input type="radio" name="role" id="roleMember" checked onclick="switchRole('member')">
          <label for="roleMember">👤 I'm a member</label>
          <input type="radio" name="role" id="roleAdmin" onclick="switchRole('admin')">
          <label for="roleAdmin">🏢 I'm a gym owner</label>
        </div>

        <div class="mb-3">
          <label class="form-label">Full name</label>
          <input type="text" class="form-control" id="regName" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="regEmail" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" id="regUsername" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="regPassword" required minlength="4">
        </div>

        <div id="gymNameGroup" class="mb-3 d-none">
          <label class="form-label">Gym name</label>
          <input type="text" class="form-control" id="regGymName" placeholder="e.g. Ember Fitness Club">
          <div class="text-faint mt-1" style="font-size:.75rem;">We'll generate a unique gym code you can share with members.</div>
        </div>

        <div id="gymCodeGroup" class="mb-3">
          <label class="form-label">Gym code <span class="text-faint" style="text-transform:none;">(optional)</span></label>
          <input type="text" class="form-control text-uppercase" id="regGymCode" placeholder="e.g. AB12CD">
          <div class="text-faint mt-1" style="font-size:.75rem;">Ask your gym owner for this. You can also add it later from your profile.</div>
        </div>

        <div class="row">
          <div class="col-6 mb-3">
            <label class="form-label">Weight (kg)</label>
            <input type="number" class="form-control" id="regWeight" value="70" min="30" max="250" required>
          </div>
          <div class="col-6 mb-3">
            <label class="form-label">Height (cm)</label>
            <input type="number" class="form-control" id="regHeight" value="170" min="100" max="230" required>
          </div>
        </div>
        <button type="submit" class="btn btn-ember w-100 mt-2">Create account</button>
      </form>
    </div>
    <div class="text-center text-faint mt-3" style="font-size:.75rem;">
      Runs fully client-side · Pose data never leaves your device
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
