<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burn-Ex — Profile</title>
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="app-shell">
  <aside id="sidebarMount"></aside>
  <div class="main-area">
    <div id="topbarMount"></div>

    <div class="row g-3">
      <div class="col-lg-4">
        <div class="card-b text-center">
          <div class="profile-avatar mx-auto mb-2" id="profAvatar">--</div>
          <div style="font-weight:600;" id="profName">—</div>
          <div class="text-faint" style="font-size:.8rem;" id="profSince">Member since —</div>
          <hr style="border-color:var(--border);">
          <div class="d-flex justify-content-around text-center mb-3">
            <div><div class="mono fw-bold" id="profBmi">—</div><div class="text-faint" style="font-size:.7rem;">BMI</div></div>
            <div><div class="mono fw-bold" id="profWorkouts">0</div><div class="text-faint" style="font-size:.7rem;">Sessions</div></div>
          </div>
          <div class="text-start">
            <div class="section-title" style="font-size:.85rem;">🏢 Gym</div>
            <div id="gymStatusBox" class="text-dim" style="font-size:.85rem;"></div>
            <form id="joinGymForm" class="d-none mt-2" onsubmit="return joinGym(event)">
              <div class="input-group input-group-sm">
                <input type="text" class="form-control text-uppercase" id="joinGymCode" placeholder="Gym code">
                <button class="btn btn-ember" type="submit">Join</button>
              </div>
            </form>
          </div>
        </div>
      </div>
      <div class="col-lg-8">
        <div class="card-b">
          <div class="section-title">Edit profile</div>
          <form onsubmit="return saveProfile(event)">
            <div class="row">
              <div class="col-md-6 mb-3"><label class="form-label">Full name</label><input class="form-control" id="pfName" required></div>
              <div class="col-md-6 mb-3"><label class="form-label">Age</label><input type="number" min="10" max="100" class="form-control" id="pfAge" required></div>
              <div class="col-md-6 mb-3"><label class="form-label">Gender</label>
                <select class="form-select" id="pfGender">
                  <option value="male">Male</option><option value="female">Female</option><option value="other">Other</option>
                </select>
              </div>
              <div class="col-md-6 mb-3"><label class="form-label">Weight (kg)</label><input type="number" step="0.1" min="30" max="250" class="form-control" id="pfWeight" required></div>
              <div class="col-md-6 mb-3"><label class="form-label">Height (cm)</label><input type="number" min="100" max="230" class="form-control" id="pfHeight" required></div>
              <div class="col-md-6 mb-3"><label class="form-label">Daily calorie goal</label><input type="number" min="50" max="5000" class="form-control" id="pfGoal" required></div>
            </div>
            <button class="btn btn-ember mt-1" type="submit">Save changes</button>
            <span class="text-teal ms-2 d-none" id="profSavedMsg" style="font-size:.85rem;">✓ Saved</span>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast-burnex" id="toastBox"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
