<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burn-Ex — History</title>
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="app-shell">
  <aside id="sidebarMount"></aside>
  <div class="main-area">
    <div id="topbarMount"></div>

    <div class="card-b">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
        <div class="section-title mb-0">📜 Session log</div>
        <div class="d-flex gap-2">
          <select class="form-select form-select-sm" id="historyFilter" onchange="renderHistory()" style="width:auto;">
            <option value="all">All activities</option>
            <option value="squat">Squats</option>
            <option value="pushup">Push-ups</option>
            <option value="curl">Bicep Curls</option>
            <option value="jack">Jumping Jacks</option>
            <option value="walk">Walking</option>
          </select>
          <button class="btn btn-sm btn-outline-teal" onclick="clearHistory()">Clear all</button>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table class="table-burnex" id="historyTable">
          <thead><tr><th>Date</th><th>Activity</th><th>Duration</th><th>Reps</th><th>Calories</th><th></th></tr></thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
      <div id="historyEmpty" class="empty-state d-none">
        <div class="ic">📭</div>
        No sessions yet — head to Live Workout or Walking to log your first one.
      </div>
    </div>
  </div>
</div>

<div class="toast-burnex" id="toastBox"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script src="js/history.js"></script>
</body>
</html>
