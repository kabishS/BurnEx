<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burn-Ex — Reset password</title>
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="auth-wrap">
  <div style="width:100%;max-width:440px;">
    <div class="text-center mb-4">
      <a href="index.html" class="brand-mark justify-content-center" style="color:var(--text);">
        <span class="flame">🔥</span> Burn-Ex
      </a>
      <div class="text-dim mt-1" style="font-size:.85rem;">Reset your password</div>
    </div>

    <div class="auth-card">
      <div id="resetError" class="auth-error d-none"></div>
      <div class="auth-note">
        Burn-Ex doesn't send reset emails — enter your username and the email
        you registered with, and you can set a new password directly.
      </div>

      <!-- STEP 1: verify identity -->
      <form id="verifyForm" onsubmit="return handleVerify(event)">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" id="fpUsername" required autocomplete="username">
        </div>
        <div class="mb-3">
          <label class="form-label">Email used at signup</label>
          <input type="email" class="form-control" id="fpEmail" required>
        </div>
        <button type="submit" class="btn btn-ember w-100 mt-2">Continue</button>
      </form>

      <!-- STEP 2: set new password -->
      <form id="resetForm" class="d-none" onsubmit="return handleReset(event)">
        <div class="auth-note" style="background:var(--teal-soft);">Identity verified — choose a new password.</div>
        <div class="mb-3">
          <label class="form-label">New password</label>
          <div class="pw-field">
            <input type="password" class="form-control" id="fpNewPassword" required minlength="4">
            <button type="button" class="pw-toggle" onclick="togglePasswordVisibility('fpNewPassword', this)" aria-label="Show password">👁</button>
          </div>
        </div>
        <button type="submit" class="btn btn-ember w-100 mt-2">Set new password</button>
      </form>
    </div>

    <div class="text-center text-faint mt-3" style="font-size:.75rem;">
      <a href="index.html">← Back to log in</a>
    </div>
  </div>
</div>

<div class="toast-burnex" id="toastBox"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script src="js/forgot-password.js"></script>
</body>
</html>
