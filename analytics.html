<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burn-Ex — Analytics</title>
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="app-shell">
  <aside id="sidebarMount"></aside>
  <div class="main-area">
    <div id="topbarMount"></div>

    <div class="row g-3 mb-3">
      <div class="col-6 col-lg-3"><div class="card-b stat-card"><div class="stat-label">Total calories</div><div class="stat-value text-ember" id="anTotalCal">0</div></div></div>
      <div class="col-6 col-lg-3"><div class="card-b stat-card"><div class="stat-label">Total reps</div><div class="stat-value text-teal" id="anTotalReps">0</div></div></div>
      <div class="col-6 col-lg-3"><div class="card-b stat-card"><div class="stat-label">Avg / session</div><div class="stat-value" id="anAvgCal">0</div></div></div>
      <div class="col-6 col-lg-3"><div class="card-b stat-card"><div class="stat-label">Favorite move</div><div class="stat-value" style="font-size:1.2rem;" id="anFav">—</div></div></div>
    </div>

    <div class="row g-3">
      <div class="col-lg-7">
        <div class="card-b">
          <div class="section-title">📈 Calories — last 30 days</div>
          <div class="chart-box"><canvas id="chartTrend"></canvas></div>
        </div>
      </div>
      <div class="col-lg-5">
        <div class="card-b">
          <div class="section-title">🥧 Activity mix</div>
          <div class="chart-box"><canvas id="chartMix"></canvas></div>
        </div>
      </div>
      <div class="col-12">
        <div class="card-b">
          <div class="section-title">📊 Weekly calories</div>
          <div class="chart-box"><canvas id="chartWeekly"></canvas></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast-burnex" id="toastBox"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script src="js/analytics.js"></script>
</body>
</html>
