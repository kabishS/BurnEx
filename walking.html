<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burn-Ex — Walking</title>
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<style>#walkMap{ height:280px; border-radius:14px; border:1px solid var(--border); z-index:0; }</style>
</head>
<body>

<div class="app-shell">
  <aside id="sidebarMount"></aside>
  <div class="main-area">
    <div id="topbarMount"></div>

    <div class="row g-3">
      <div class="col-lg-4">
        <div class="row g-3 mb-3">
          <div class="col-6 col-lg-12"><div class="card-b stat-card"><div class="stat-label">Today's kcal</div><div class="stat-value text-ember" id="walkTodayCal">0</div></div></div>
          <div class="col-6 col-lg-12"><div class="card-b stat-card"><div class="stat-label">Today's distance</div><div class="stat-value text-teal" id="walkTodayDist">0.0<span style="font-size:1rem;color:var(--text-dim);"> km</span></div></div></div>
        </div>

        <div class="card-b">
          <div class="section-title">🚶 Log a walk</div>
          <form id="walkForm" onsubmit="return logWalk(event)">
            <div class="mb-3">
              <label class="form-label">Duration (minutes)</label>
              <input type="number" class="form-control" id="walkDuration" min="1" max="600" step="1" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Distance (km) <span class="text-faint" style="text-transform:none;">(optional — estimated from route if left blank)</span></label>
              <input type="number" class="form-control" id="walkDistance" min="0" max="100" step="0.1">
            </div>
            <div class="mb-3">
              <label class="form-label">Pace</label>
              <select class="form-select" id="walkPace"></select>
            </div>
            <div class="mb-3">
              <label class="form-label">Start place</label>
              <input type="text" class="form-control" id="walkStartPlace" placeholder="e.g. Gandhipuram, Coimbatore">
            </div>
            <div class="mb-3">
              <label class="form-label">End place</label>
              <input type="text" class="form-control" id="walkEndPlace" placeholder="e.g. RS Puram, Coimbatore">
            </div>
            <button type="submit" class="btn btn-ember w-100">Log walk</button>
          </form>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card-b mb-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div class="section-title mb-0">🗺️ Route</div>
            <div class="text-faint" id="walkMapStatus" style="font-size:.78rem;">Add a start and end place to see the route here.</div>
          </div>
          <div id="walkMap"></div>
        </div>

        <div class="card-b">
          <div class="section-title">📜 Recent walks (<span id="walkTotalCount">0</span> total)</div>
          <div style="overflow-x:auto;">
            <table class="table-burnex">
              <thead><tr><th>Date</th><th>Duration</th><th>Distance</th><th>Route</th><th>Calories</th><th></th></tr></thead>
              <tbody id="walkListBody"></tbody>
            </table>
          </div>
          <div id="walkListEmpty" class="empty-state d-none">
            <div class="ic">🚶</div>
            No walks logged yet — add your first one on the left.
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast-burnex" id="toastBox"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script src="js/calories.js"></script>
<script src="js/walking.js"></script>
</body>
</html>
