<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burn-Ex — Food</title>
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/food.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="app-shell">
  <aside id="sidebarMount"></aside>
  <div class="main-area">
    <div id="topbarMount"></div>

    <div class="card-b mb-3">
      <div class="section-title">🎯 Your BMI &amp; daily burn</div>
      <div id="bmiSectionBody"></div>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-4"><div class="card-b stat-card"><div class="stat-label">Burned today</div><div class="stat-value text-ember" id="foodBurned">0</div></div></div>
      <div class="col-4"><div class="card-b stat-card"><div class="stat-label">Daily goal</div><div class="stat-value" id="foodGoal">0</div></div></div>
      <div class="col-4"><div class="card-b stat-card"><div class="stat-label">Remaining</div><div class="stat-value text-teal" id="foodRemaining">0</div></div></div>
    </div>

    <div class="card-b mb-3">
      <div class="section-title mb-2">🍎 Meal ideas</div>
      <div class="pill-toggle" id="foodCategoryTabs" style="max-width:520px;">
        <button class="active" onclick="setFoodCategory('all', this)">All</button>
        <button onclick="setFoodCategory('breakfast', this)">Breakfast</button>
        <button onclick="setFoodCategory('lunch', this)">Lunch</button>
        <button onclick="setFoodCategory('dinner', this)">Dinner</button>
        <button onclick="setFoodCategory('snack', this)">Snack</button>
      </div>
    </div>

    <div class="row g-3" id="foodGrid"></div>
  </div>
</div>

<div class="toast-burnex" id="toastBox"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script src="js/calories.js"></script>
<script src="js/food.js"></script>
</body>
</html>
