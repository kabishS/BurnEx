<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burn-Ex — Dashboard</title>
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="app-shell">
  <aside id="sidebarMount"></aside>
  <div class="main-area">
    <div id="topbarMount"></div>

    <div class="row g-3 mb-3">
      <div class="col-6 col-lg-3">
        <div class="card-b stat-card"><span class="stat-icon">🔥</span><div class="stat-label">Today's calories</div><div class="stat-value text-ember" id="statToday">0</div></div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card-b stat-card"><span class="stat-icon">📅</span><div class="stat-label">This week</div><div class="stat-value text-teal" id="statWeek">0</div></div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card-b stat-card"><span class="stat-icon">🏋️</span><div class="stat-label">Total workouts</div><div class="stat-value" id="statCount">0</div></div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card-b stat-card"><span class="stat-icon">⚡</span><div class="stat-label">Current streak</div><div class="stat-value" id="statStreak">0<span style="font-size:1rem;color:var(--text-dim);"> days</span></div></div>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-lg-4">
        <div class="card-b h-100">
          <div class="section-title">🎯 Daily goal</div>
          <div class="ring-wrap">
            <svg width="150" height="150" viewBox="0 0 150 150">
              <circle class="ring-bg" cx="75" cy="75" r="62"></circle>
              <circle class="ring-fg" id="goalRing" cx="75" cy="75" r="62" stroke-dasharray="389" stroke-dashoffset="389"></circle>
            </svg>
            <div class="ring-center"><div class="val mono" id="goalPct">0%</div><div class="lbl">of goal</div></div>
          </div>
          <div class="text-center text-dim mt-2" style="font-size:.82rem;" id="goalCaption">0 / 400 kcal today</div>
        </div>
      </div>
      <div class="col-lg-8">
        <div class="card-b h-100">
          <div class="section-title">📈 Last 7 days</div>
          <div class="chart-box" style="height:220px;"><canvas id="chartWeekMini"></canvas></div>
        </div>
      </div>
    </div>

    <div class="card-b mt-3">
      <div class="section-title">🕓 Recent activity</div>
      <div id="recentActivityList"></div>
    </div>
  </div>
</div>

<div class="toast-burnex" id="toastBox"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
