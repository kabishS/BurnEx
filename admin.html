<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burn-Ex — Admin Dashboard</title>
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="app-shell">
  <aside id="sidebarMount"></aside>
  <div class="main-area">
    <div id="topbarMount"></div>

    <div class="card-b mb-3">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div>
          <div class="text-dim" style="font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;">Your gym</div>
          <div class="font-d fw-bold" style="font-size:1.4rem;" id="adminGymName">—</div>
        </div>
        <div class="text-center">
          <div class="text-dim" style="font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;">Share this code with members</div>
          <div class="gym-code-box" id="adminGymCode">——————</div>
        </div>
      </div>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-6 col-lg-4"><div class="card-b stat-card"><span class="stat-icon">👥</span><div class="stat-label">Members</div><div class="stat-value" id="adminMemberCount">0</div></div></div>
      <div class="col-6 col-lg-4"><div class="card-b stat-card"><span class="stat-icon">🔥</span><div class="stat-label">Calories today (gym)</div><div class="stat-value text-ember" id="adminTodayCal">0</div></div></div>
      <div class="col-12 col-lg-4"><div class="card-b stat-card"><span class="stat-icon">📅</span><div class="stat-label">Calories this week (gym)</div><div class="stat-value text-teal" id="adminWeekCal">0</div></div></div>
    </div>

    <div class="card-b">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div class="section-title mb-0">🏆 Top members this week</div>
        <a href="admin-leaderboard.html" class="badge-soft">View full leaderboard →</a>
      </div>
      <div id="adminTopMembers"></div>
    </div>
  </div>
</div>

<div class="toast-burnex" id="toastBox"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script src="js/admin.js"></script>
<script>initAdminPage('admin', renderAdminDashboard);</script>
</body>
</html>
