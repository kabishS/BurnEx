<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burn-Ex — Weekly Tasks</title>
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<style>
  .wt-today{ box-shadow:0 0 0 1px var(--ember); }
  .wt-progress-track{ height:8px; border-radius:999px; background:var(--bg-elev); overflow:hidden; }
  .wt-progress-fill{ height:100%; background:linear-gradient(90deg,var(--ember),#FF9366); border-radius:999px; transition:width .4s ease; }
</style>
</head>
<body>

<div class="app-shell">
  <aside id="sidebarMount"></aside>
  <div class="main-area">
    <div id="topbarMount"></div>

    <div class="row g-3 mb-3">
      <div class="col-6 col-lg-4">
        <div class="card-b stat-card">
          <span class="stat-icon">⚡</span>
          <div class="stat-label">Current streak</div>
          <div class="stat-value text-ember" id="wtStreak">0<span style="font-size:1rem;color:var(--text-dim);"> days</span></div>
        </div>
      </div>
      <div class="col-6 col-lg-8">
        <div class="card-b stat-card">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div class="stat-label">This week</div>
            <div class="mono text-teal" id="wtWeekProgress" style="font-size:.85rem;">0 / 6 this week</div>
          </div>
          <div class="wt-progress-track"><div class="wt-progress-fill" id="wtWeekBar" style="width:0%;"></div></div>
        </div>
      </div>
    </div>

    <div class="card-b mb-3">
      <div class="section-title">✅ Monday – Saturday tasks</div>
      <div class="text-dim mb-3" style="font-size:.85rem;">Sunday is a rest day — no task, and it never breaks your streak.</div>
      <div class="row g-3" id="wtWeekGrid"></div>
    </div>
  </div>
</div>

<div class="toast-burnex" id="toastBox"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script src="js/weektask.js"></script>
</body>
</html>
